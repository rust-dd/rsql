[package]
name = "rsql"
version = "1.2.0"
description = "Modern SQL Client"
authors = ["rust-dd"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rsql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["."]
resolver = "3"

[workspace.dependencies]
csv = "1.3"
deadpool-postgres = "0.14.1"
futures-util = "0.3"
libsql = "0.9.29"
native-tls = "0.2"
portable-pty = "0.9.0"
postgres-native-tls = "0.5"
rayon = "1.11.0"
russh = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
sysinfo = "0.38.3"
tauri = { version = "2.12.1" }
tauri-build = { version = "2" }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-updater = "2.13.1"
thiserror = "2"
tokio = "1.47.1"
tokio-postgres = "0.7.13"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
csv = { workspace = true }
deadpool-postgres = { workspace = true }
futures-util = { workspace = true }
libsql = { workspace = true }
native-tls = { workspace = true }
portable-pty = { workspace = true }
postgres-native-tls = { workspace = true }
rayon = { workspace = true }
russh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
sysinfo = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-updater = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
