name: Dependency advisories
on:
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:
    inputs:
      revision:
        description: "Commit or tag to audit (defaults to the selected branch)"
        required: false
        type: string
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/yarn.lock"
      - "deny.toml"

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: yarn install --frozen-lockfile
        working-directory: website
      - run: node scripts/audit-dependencies.mjs website
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          rust-version: "1.98.0"
          arguments: --locked --config deny.toml
          command: check
          command-arguments: advisories
