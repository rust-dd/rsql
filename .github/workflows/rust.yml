name: Rust

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  lint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      # Toolchain comes from the repository-root rust-toolchain.toml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libgtk-3-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked -p rsql-core -p rsql-desktop --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libgtk-3-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build native app
        run: cargo build --locked -p rsql-desktop --features production
