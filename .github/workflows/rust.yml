name: Rust

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      # Toolchain comes from src-tauri/rust-toolchain.toml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Start PostgreSQL with a self-signed certificate
        run: |
          mkdir tls
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout tls/server.key -out tls/server.crt
          sudo chown 999:999 tls/server.key tls/server.crt
          sudo chmod 600 tls/server.key
          docker run -d --name postgres-tls -p 5433:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/tls:/tls:ro" postgres:${{ matrix.postgres }} \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for attempt in $(seq 30); do
            docker exec postgres-tls pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 2
          done
          docker logs postgres-tls
          exit 1

      - name: Start PostgreSQL with a certificate from a trusted test CA
        run: |
          mkdir trusted-tls
          cd trusted-tls
          openssl req -new -x509 -days 1 -nodes -subj "/CN=rsql test CA" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" \
            -keyout ca.key -out ca.crt
          openssl req -new -nodes -subj "/CN=db.internal" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:db.internal\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -days 1 -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -extfile server.ext -out server.crt
          sudo cp ca.crt /usr/local/share/ca-certificates/rsql-test-ca.crt
          sudo update-ca-certificates
          sudo chown 999:999 server.key server.crt
          sudo chmod 600 server.key
          docker run -d --name postgres-trusted-tls -p 5434:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$PWD:/tls:ro" postgres:${{ matrix.postgres }} \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for attempt in $(seq 30); do
            docker exec postgres-trusted-tls pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 2
          done
          docker logs postgres-trusted-tls
          exit 1

      - name: Integration tests against PostgreSQL
        run: |
          cargo test --locked --test row_mutations --test schema_index --test foreign_keys -- --ignored
          cargo test --locked --bin rsql -- --ignored
        working-directory: src-tauri
        env:
          RSQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          RSQL_TEST_TLS_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres
          RSQL_TEST_TRUSTED_TLS_DATABASE_URL: postgres://postgres:postgres@localhost:5434/postgres
