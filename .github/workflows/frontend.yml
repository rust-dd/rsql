name: Frontend

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      - name: Lint and format
        run: yarn check:ci

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      # The release build was the only thing that bundled, so a failure that
      # only shows up there — an out-of-memory crash, a module that will not
      # resolve — reached a tag before anyone saw it.
      - name: Build
        run: yarn build
