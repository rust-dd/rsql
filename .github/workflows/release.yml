name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.x.x)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify tag and version
        run: node scripts/check-version.mjs --tag "$RELEASE_TAG"
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust:
    needs: verify-version
    uses: ./.github/workflows/rust.yml
    with:
      revision: ${{ needs.verify-version.outputs.revision }}

  package:
    needs: [verify-version, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      REVISION: ${{ needs.verify-version.outputs.revision }}
      BIN: target/${{ matrix.target }}/release
      # Git Bash would otherwise rewrite path-like arguments passed to cargo-packager on Windows.
      MSYS_NO_PATHCONV: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-version.outputs.revision }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang file libfontconfig-dev libgtk-3-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev rpm

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install packaging tools
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tools
        run: |
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          if [ "$RUNNER_OS" = Linux ]; then
            cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked
          fi

      - name: Validate signing secrets
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGETOOL_SIGN_PASSPHRASE }}
        run: |
          required=(TAURI_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY)
          case "$RUNNER_OS" in
            Windows) required+=(WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD) ;;
            Linux) required+=(TAURI_SIGNING_RPM_KEY APPIMAGETOOL_SIGN_PASSPHRASE) ;;
          esac
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || { echo "::error::Missing $name secret."; exit 1; }
          done

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          case "$MACOS_SIGNING_ENABLED" in
            true) ;;
            ''|false)
              echo "::warning::macOS signing is disabled. This build requires a Gatekeeper override. See docs/macos-release.md."
              exit 0
              ;;
            *)
              echo "::error::MACOS_SIGNING_ENABLED must be true or false."
              exit 1
              ;;
          esac

          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name secret. See docs/macos-release.md."
              exit 1
            fi
            if [[ "${!name}" == *$'\n'* || "${!name}" == *$'\r'* ]]; then
              echo "::error::$name must be a single line. Encode the certificate with openssl base64 -A."
              exit 1
            fi
          done

          if [[ "$APPLE_SIGNING_IDENTITY" != 'Developer ID Application: '* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must identify a Developer ID Application certificate."
            exit 1
          fi

          # cargo-packager reads the certificate and notarization credentials from these variables.
          for name in "${required[@]}"; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
          Remove-Item -Path certificate/tempCert.txt

          $certificate = Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Path certificate -Recurse -Force

          if (-not $certificate) {
            Write-Error "Failed to import Windows signing certificate."
            exit 1
          }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import Linux signing key (AppImage + RPM)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
        run: |
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          printf '%s' "$TAURI_SIGNING_RPM_KEY" | gpg --batch --import

      - name: Write packager configuration
        run: |
          # Forward-slash absolute paths work for both Git Bash and native Windows tools.
          root=$(pwd -W 2>/dev/null || pwd)
          mkdir -p dist packages
          printf 'DIST=%s\nPACKAGES=%s\n' "$root/dist" "$root/packages" >> "$GITHUB_ENV"
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/metadata.json"
          jq -c --arg version "${RELEASE_TAG#v}" --arg bin "$root/$BIN" --arg out "$root/packages" '
            .packages[] | select(.name == "rsql-desktop") | .metadata.packager
            | .version = $version | .["binaries-dir"] = $bin | .["out-dir"] = $out
          ' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/packager.json"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=$(jq -r '.macos["minimum-system-version"]' "$RUNNER_TEMP/packager.json")" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          RSQL_BUILD_REVISION: ${{ env.REVISION }}
        run: |
          cargo build -p rsql-desktop --release --features production --locked --target ${{ matrix.target }}
          output=$("$BIN/rsql-desktop" --help 2>&1 || true)
          [[ "$output" == *"Usage: rsql-desktop"* ]] || { echo "::error::The release binary did not start: $output"; exit 1; }

      - name: Package macOS app and disk image
        if: runner.os == 'macOS'
        working-directory: crates/rsql-desktop
        run: |
          plist="$RUNNER_TEMP/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert RSQLBuildRevision -string "$REVISION" "$plist"
          config=$(jq -c --arg plist "$plist" --arg identity "${APPLE_SIGNING_IDENTITY:-}" '
            .macos["info-plist-path"] = $plist
            | if $identity == "" then . else .macos["signing-identity"] = $identity end
          ' "$RUNNER_TEMP/packager.json")
          cargo packager --config "$config" --formats app,dmg

      - name: Verify macOS bundle identity
        if: runner.os == 'macOS'
        run: |
          app="$PACKAGES/RSQL.app"
          read_key() { plutil -extract "$1" raw "$app/Contents/Info.plist"; }
          [ "$(read_key CFBundleIdentifier)" = com.rust-dd.rsql ]
          [ "$(read_key CFBundleExecutable)" = rsql-desktop ]
          [ "$(read_key CFBundleShortVersionString)" = "${RELEASE_TAG#v}" ]
          [ "$(read_key RSQLBuildRevision)" = "$REVISION" ]
          [ "$(read_key LSMinimumSystemVersion)" = "$MACOSX_DEPLOYMENT_TARGET" ]
          vtool -show-build "$app/Contents/MacOS/rsql-desktop" | grep -E "minos ${MACOSX_DEPLOYMENT_TARGET}$"
          if [ -n "$(find "$app" -type l)" ]; then
            echo "::error::The updater rejects symbolic links inside RSQL.app."
            exit 1
          fi

      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: |
          app="$PACKAGES/RSQL.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep 'flags=.*runtime'
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Notarize and verify the macOS disk image
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: |
          disk_image="$PACKAGES/RSQL_${RELEASE_TAG#v}_${{ matrix.arch }}.dmg"
          report=$(mktemp "$RUNNER_TEMP/rsql-notarization.XXXXXX")
          xcrun notarytool submit "$disk_image" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$report"
          cat "$report"
          if ! jq -e '.status == "Accepted"' "$report" > /dev/null; then
            echo "::error::Apple did not accept the disk image for notarization."
            exit 1
          fi
          xcrun stapler staple "$disk_image"
          xcrun stapler validate "$disk_image"
          codesign --verify --strict --verbose=2 "$disk_image"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$disk_image"

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mv "$PACKAGES/RSQL_${RELEASE_TAG#v}_${{ matrix.arch }}.dmg" "$DIST/"
          # The updater only accepts plain ustar entries: no pax headers, xattrs or AppleDouble files.
          COPYFILE_DISABLE=1 tar --format ustar --no-xattrs --no-mac-metadata -czf \
            "$DIST/RSQL_${RELEASE_TAG#v}_${{ matrix.arch }}.app.tar.gz" -C "$PACKAGES" RSQL.app

      - name: Package Windows installer
        if: runner.os == 'Windows'
        working-directory: crates/rsql-desktop
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          config=$(jq -c --arg thumbprint "$WINDOWS_CERTIFICATE_THUMBPRINT" \
            --arg timestamp "${WINDOWS_TIMESTAMP_URL:-http://timestamp.digicert.com}" '
            .windows = {"certificate-thumbprint": $thumbprint, "digest-algorithm": "sha256", "timestamp-url": $timestamp}
          ' "$RUNNER_TEMP/packager.json")
          cargo packager --config "$config" --formats nsis
          mv "$PACKAGES"/*-setup.exe "$DIST/"

      - name: Package Linux bundles
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SIGN: "1"
          APPIMAGETOOL_FORCE_SIGN: "1"
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGETOOL_SIGN_PASSPHRASE }}
          TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ secrets.TAURI_SIGNING_RPM_KEY_PASSPHRASE }}
        run: |
          (cd crates/rsql-desktop && cargo packager --config "$(cat "$RUNNER_TEMP/packager.json")" --formats deb,appimage)
          mv "$PACKAGES"/*.deb "$PACKAGES"/*.AppImage "$DIST/"

          # RPM versions cannot contain "-"; "~" sorts a prerelease before its release.
          cargo generate-rpm -p crates/rsql-desktop --target ${{ matrix.target }} -o "$DIST/" \
            --set-metadata "version = \"$(tr - '~' <<< "${RELEASE_TAG#v}")\""
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          printf '%s' "$TAURI_SIGNING_RPM_KEY_PASSPHRASE" > "$RUNNER_TEMP/rpm-passphrase"
          rpmsign --addsign --define "_gpg_name $key" \
            --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/rpm-passphrase" \
            "$DIST"/*.rpm
          rm "$RUNNER_TEMP/rpm-passphrase"
          signature=$(rpm -qp --qf '%|DSAHEADER?{%{DSAHEADER:pgpsig}}:{%|RSAHEADER?{%{RSAHEADER:pgpsig}}:{(none)}|}|' "$DIST"/*.rpm)
          echo "RPM signature: $signature"
          [ "$signature" != "(none)" ]

      - name: Sign updater artifacts
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for file in "$DIST"/*.app.tar.gz "$DIST"/*.exe "$DIST"/*.AppImage "$DIST"/*.deb "$DIST"/*.rpm; do
            cargo packager signer sign "$file"
          done
          ls -l "$DIST"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify-version, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      REVISION: ${{ needs.verify-version.outputs.revision }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-version.outputs.revision }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - uses: swatinem/rust-cache@v2

      - name: Install cargo-packager
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tools
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Write and sign the native update inventory
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          minimum=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "rsql-desktop") | .metadata.packager.macos["minimum-system-version"]')
          node scripts/native-inventory.mjs dist --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --revision "$REVISION" --macos-minimum "$minimum"
          cargo packager signer sign dist/inventory.json

      # latest.json serves the native artifacts to installed Tauri builds, which migrate on their next update.
      - name: Assemble and verify both update feeds
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          printf '%s' "$TAURI_UPDATER_PUBLIC_KEY" > "$RUNNER_TEMP/updater.pub"
          cargo run --locked --release -p rsql-core --example release-feeds -- \
            "$RUNNER_TEMP/updater.pub" dist feeds

      - name: Upload to the draft release
        run: |
          assets=()
          for file in dist/*; do
            case "$file" in dist/inventory.json*) ;; *) assets+=("$file") ;; esac
          done
          assets+=(feeds/latest.json feeds/native-latest.json)

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::$RELEASE_TAG is already published."; exit 1; }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag "${prerelease[@]}" \
              --title "RSQL $RELEASE_TAG" --notes "See the assets to download and install this version."
          fi
