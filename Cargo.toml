[workspace]
members = ["crates/rsql-core", "crates/rsql-desktop"]
default-members = ["crates/rsql-desktop"]
exclude = ["vendor/alacritty_terminal-0.26.0", "vendor/gpui-base-0.10.0", "vendor/gpui-component-0.10.0", "vendor/gpui-pre-macos-0.3.12", "vendor/vte-0.15.0"]
resolver = "3"

[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "=0.22.1"
block2 = "=0.6.2"
bytes = "1"
chrono = "0.4"
crc32fast = "=1.5.0"
csv = "1.3"
csv-core = "0.1.13"
deadpool = { version = "=0.13.1", default-features = false, features = ["managed"] }
deadpool-postgres = "0.14.1"
dirs = "6"
flate2 = { version = "=1.1.2", default-features = false }
futures-util = "0.3"
geozero = { version = "=0.15.1", default-features = false, features = ["with-geojson", "with-wkb", "with-wkt"] }
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-sql"] }
gpui-pre-macos = { version = "=0.3.12", default-features = false }
hex = "0.4.3"
http-cache-rules = { version = "=0.1.0", default-features = false }
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
icu_properties = "=2.4.0"
image = { version = "=0.25.10", default-features = false }
libc = "0.2"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
lsp-types = "=0.97.0"
mach2 = "0.6"
minisign-verify = "=0.3.0"
native-tls = "0.2"
num-format = { version = "=0.4.4", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSBundle", "NSFormatter", "NSGeometry", "NSNumberFormatter", "NSString", "NSValue", "objc2-core-foundation", "std"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter", "block2", "std"] }
object = { version = "=0.39.1", default-features = false }
percent-encoding = "2.3"
pg_query = "=18.1.0"
plist = { version = "=1.10.1", default-features = false }
png = { version = "=0.18.1", default-features = false }
portable-pty = "0.9.0"
postgres-native-tls = "0.5"
rand = "0.10"
rayon = "1.11.0"
reqwest = { version = "=0.13.2", default-features = false, features = ["native-tls-no-alpn"] }
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }
ropey = "=2.0.0-beta.1"
roxmltree = { version = "=0.21.2", default-features = false }
rsql-core = { path = "crates/rsql-core" }
russh = "0.65.0"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_stacker = "0.1"
sha2 = "0.11.0"
sqlformat = "=0.5.0"
sqlparser = { version = "=0.59.0", default-features = false, features = ["std"] }
sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.12" }
sys-locale = "=0.3.2"
sysinfo = "0.40.1"
tar = { version = "=0.4.45", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"
tracing = "0.1.41"
tree-sitter = "=0.26.13"
tree-sitter-postgres = "=1.2.4"
tree-sitter-sequel = "=0.3.13"
url = "2.5"
uuid = { version = "1.18.1", features = ["v4"] }
winapi-util = "0.1.11"
windows = { version = "=0.62.1", default-features = false, features = ["Globalization_NumberFormatting", "UI_Notifications", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal-0.26.0" }
gpui-base = { path = "vendor/gpui-base-0.10.0" }
gpui-component = { path = "vendor/gpui-component-0.10.0" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos-0.3.12" }
vte = { path = "vendor/vte-0.15.0" }
